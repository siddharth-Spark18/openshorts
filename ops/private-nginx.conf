limit_req_zone $binary_remote_addr zone=owner_login:1m rate=6r/m;
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 2050m;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Frame-Options DENY always;
    location = /owner/login {
        limit_req zone=owner_login burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://backend:8000;
    }
    location = /owner/check {
        internal;
        proxy_method GET;
        proxy_pass http://backend:8000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /owner/logout { proxy_pass http://backend:8000; }
    location ~ ^/(api|videos|thumbnails|mcp)(/|$) {
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
    }
    location /render {
        auth_request /owner/check;
        proxy_pass http://renderer:3100;
    }
    location / {
        auth_request /owner/check;
        error_page 401 = @signin;
        try_files $uri $uri/ =404;
    }
    location @signin { return 303 /owner/login; }
}
