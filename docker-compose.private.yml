# Standalone single-owner deployment. Reach the loopback port over SSH.
services:
  backend:
    build:
      context: .
      args:
        CPU_ONLY: "1"
    restart: unless-stopped
    environment:
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD for the private workspace}
      CLIP_LIBRARY_DIR: /app/library
      DRIVE_CLIENT_ID: ${DRIVE_CLIENT_ID:-}
      DRIVE_CLIENT_SECRET: ${DRIVE_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_OAUTH_REDIRECT_URI: ${YOUTUBE_OAUTH_REDIRECT_URI:-https://openshorts-dev.duckdns.org/api/factory/youtube/callback}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_OAUTH_REDIRECT_URI: ${INSTAGRAM_OAUTH_REDIRECT_URI:-https://openshorts-dev.duckdns.org/api/factory/instagram/callback}
      FACTORY_PUBLIC_SITE_URL: ${FACTORY_PUBLIC_SITE_URL:-https://openshorts-dev.duckdns.org}
      DRIVE_PICKER_API_KEY: ${DRIVE_PICKER_API_KEY:-}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      YOUTUBE_COOKIES_PATH: /app/output/.youtube-cookies.txt
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UPLOAD_POST_API_KEY: ${UPLOAD_POST_API_KEY:-}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      CLIP_WORKERS: ${CLIP_WORKERS:-1}
      LOW_MEMORY_MODE: ${LOW_MEMORY_MODE:-1}
      SCENE_ENGINE: ${SCENE_ENGINE:-pyscenedetect}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      ASR_PART_SECONDS: ${ASR_PART_SECONDS:-120}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    volumes:
      - library:/app/library
      - output:/app/output
      - uploads:/app/uploads
      - models:/app/.cache/huggingface
  frontend:
    build:
      context: ./dashboard
      target: prod
    restart: unless-stopped
    depends_on: [backend, renderer]
    ports: ["127.0.0.1:5175:80"]
    volumes:
      - ./ops/private-nginx.conf:/etc/nginx/conf.d/default.conf:ro
  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    restart: unless-stopped
    environment:
      REMOTION_BUNDLE_PATH: /app/remotion
      OUTPUT_DIR: /output
    volumes:
      - output:/output
volumes:
  output:
  uploads:
  library:
  models:
